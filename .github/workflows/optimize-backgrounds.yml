name: Optimize Background Images

on:
  push:
    branches:
      - main
    paths:
      - "bgs/source/**"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    # Prevent the bot from triggering itself forever.
    if: github.actor != 'github-actions[bot]'

    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Optimize backgrounds
        run: python scripts/optimize_backgrounds.py

      - name: Commit optimized backgrounds
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add bgs configs/backgrounds.json
          git commit -m "Optimize background images"
          git push
